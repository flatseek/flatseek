[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flatseek"
version = "0.1.11"
description = "Powerful disk-first full-text search for production data, portable datasets, RAG and AI applications."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "orjson",
    "zstandard",
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx[http2]",
]

authors = [
  { name = "Judotens Budiarto", email = "judotens@flatseek.io" }
]

[project.urls]
Homepage = "https://flatseek.io"
Documentation = "https://flatseek.io/docs"
Repository = "https://github.com/flatseek/flatseek"
Issues = "https://github.com/flatseek/flatseek/issues"

Flatlens = "https://github.com/flatseek/flatlens"
Flatvec = "https://github.com/flatseek/flatvec"
Flatask = "https://github.com/flatseek/flatask"
Flattune = "https://github.com/flatseek/flattune"

Benchmarks = "https://github.com/flatseek/flatbench"


[project.scripts]
flatseek = "flatseek.cli:main"
flatseek-api = "flatseek.api_server:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "httpx[http2]",
]
parquet = [
    "pyarrow",
    "pandas",
]
chat = [
    "openai",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Auto-discovers test_*.py from root and src/flatseek/test/
testpaths = ["tests", "src/flatseek/test"]
python_files = ["test_*.py"]
python_functions = "test_*"
markers = [
    "network: tests that hit live HuggingFace / S3 / Vercel Blob / etc. Skipped in CI (workflow uses `-m 'not network'`); run locally with `pytest -m network`.",
]
