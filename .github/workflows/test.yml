name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -e ".[parquet]"
          pip install --no-cache-dir pytest pytest-cov
      - name: Run tests
        run: pytest -v --cov=src/flatseek --cov-report=xml -m "not network"
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
